<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CT Luxx Collection | Fashion, Shoes, Bags & More</title>
  <meta name="description" content="Shop women's clothing, men's clothing, shoes, heels, handbags, launch bags, underwear, kettles and more at CT Luxx Collection.">
  <meta name="theme-color" content="#f8edda">
  
  <!-- OPEN GRAPH TAGS -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CT Luxx Collection">
  <meta property="og:title" content="CT Luxx Collection — Premium Fashion & Essentials">
  <meta property="og:description" content="Discover your new favorite outfit. Fast delivery, secure payments, and excellent customer support.">
  <meta property="og:url" content="https://ct-umber-six.vercel.app/">
  <meta property="og:image" content="https://ct-umber-six.vercel.app/ctcollection-og.jpg">
  <meta property="og:image:secure_url" content="https://ct-umber-six.vercel.app/ctcollection-og.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CT Luxx Collection — Premium Fashion & Essentials">
  <meta name="twitter:description" content="Fashion, shoes, bags, underwear, kettles and more. Shop CT Luxx Collection.">
  <meta name="twitter:image" content="https://ct-umber-six.vercel.app/ctcollection-og.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --ink: #111111;
      --gold: #c28b27;
      --cream: #f8edda;
    }
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      padding: 0;
      background: var(--cream); 
      font-family: "DM Sans", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .poster-container {
      position: relative;
      width: 100%;
      max-width: 1200px; 
      margin: 0 auto;
    }

    .poster-image {
      width: 100%;
      height: auto;
      display: block;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
    }

    /* The invisible link covering the printed button */
    .shop-button {
      position: absolute;
      bottom: 9.5%; 
      left: 10.5%;  
      background: transparent;
      color: transparent;
      padding: 30px 120px; 
      border-radius: 8px;
      text-decoration: none;
      z-index: 10;
      cursor: pointer;
      transition: background 0.2s;
    }

    /* Added a subtle highlight so you can see the clickable area when hovering */
    .shop-button:hover {
      background: rgba(255, 255, 255, 0.15); 
    }

    /* Mobile adjustment to ensure button stays clickable */
    @media (max-width: 768px) {
      .poster-container {
        max-width: 100%;
      }
      .shop-button {
        bottom: 9%;
        left: 9%;
        padding: 20px 80px;
      }
    }
  </style>
</head>
<body>

  <div class="poster-container">
    <!-- The Poster Image -->
    <img src="ctcollection-og.jpg" alt="CT Luxx Collection Poster" class="poster-image" width="1200" height="630">
    
    <!-- The clickable link targeting ctcollection.vercel.app -->
    <a href="https://ctcollection.vercel.app/" class="shop-button" aria-label="Shop CT Collection"></a>
  </div>

</body>
</html>
